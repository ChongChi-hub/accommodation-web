name: Frontend CI Pipeline

on:
  push:
    branches: [main, master, develop, "feat/**"]
  pull_request:
    branches: [main, master]

jobs:
  frontend-verification:
    name: Verify Frontend (Next.js, Lint, TypeCheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Architecture Boundary Check
        run: npx eslint . --max-warnings=0

      - name: TypeScript Type Check
        run: npm run type-check

      - name: Verify i18n, Links, Seed Text, and Image Manifest
        run: |
          npm run verify:i18n
          npm run verify:links
          npm run check:seed-text
          npm run verify:manifest

      - name: Run Unit Tests
        run: npm run test

      - name: Next.js Production Build
        run: npm run build

      - name: Install Playwright Browsers and Verify Smoke Spec
        run: |
          npx playwright install chromium
          npx playwright test e2e/home1-live-verification.spec.ts --workers=1

