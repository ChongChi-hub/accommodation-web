name: Build and Deploy Frontend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-web:
    name: Build & Push Next.js Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image owner to lowercase
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cozynest-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://cozynestvvip.duckdns.org
            NEXT_PUBLIC_API_URL=https://cozynestvvip.duckdns.org/api/v1
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED=true
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/cozynest-web:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/cozynest-web:${{ github.sha }}
          cache-from: type=gha,scope=cozynest-web
          cache-to: type=gha,mode=max,scope=cozynest-web

  deploy-vps:
    name: Deploy Frontend Container on Ubuntu VPS
    needs: build-and-push-web
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GHCR owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Pull latest web image and restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.72.57.148' }}
          username: ${{ secrets.VPS_USER || 'devopsg5' }}
          port: ${{ secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/cozynest
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ steps.vars.outputs.owner }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull web
            docker compose -f docker-compose.prod.yml up -d --no-deps web
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps web

